<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madrasa Manager</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="glass-card login-card">
            <div class="logo justify-center mb-4">
                <i data-feather="book-open"></i> madrasa Manager
            </div>
            <h2 class="mb-4">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" class="form-input" placeholder="Username (admin)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-input" placeholder="Password (123)" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Login</button>
            </form>
        </div>
    </div>

    <!-- App Layout -->
    <div id="app-layout" class="app-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i data-feather="book-open"></i> madrasa
            </div>
            <nav>
                <a href="#" class="nav-link active" data-view="dashboard">
                    <i data-feather="grid"></i> Dashboard
                </a>
                <a href="#" class="nav-link" data-view="students">
                    <i data-feather="users"></i> Students
                </a>
                <a href="#" class="nav-link" data-view="attendance">
                    <i data-feather="check-circle"></i> Attendance
                </a>
                <a href="#" class="nav-link" data-view="fees">
                    <i data-feather="dollar-sign"></i> Fees
                </a>
            </nav>
            <div style="margin-top: auto;">
                <a href="#" class="nav-link" id="logout-btn">
                    <i data-feather="log-out"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-view">
            <!-- Content Injected Here -->
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
